  <title>Acesso Direto</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100dvh;
      background: radial-gradient(circle at center, #4d0037 0%, #1a0014 50%, #000 100%);
      color: #fff;
      font-family: 'Roboto', sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
      text-align: center;
      overflow: hidden;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 25px;
      max-width: 100vw;
      padding: 0 20px;
      z-index: 2;
    }

    body::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 650px;
      height: 650px;
      background: radial-gradient(circle, rgba(255, 26, 191, 0.25) 0%, transparent 80%);
      filter: blur(80px);
      animation: glowBackground 6s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    h1 {
      font-size: clamp(16px, 4.5vw, 20px);
      font-weight: 500;
      letter-spacing: 1.3px;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(255, 26, 191, 0.7);
      margin: 0;
      line-height: 1.5;
      animation: fadeIn 1s ease-in-out;
    }

    .btn {
      position: relative;
      display: inline-block;
      background: linear-gradient(90deg, #ff1abf, #ff4fd8);
      color: #fff;
      padding: 14px 36px;
      border: none;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      box-shadow: 0 0 25px rgba(255, 26, 191, 0.5);
      transition: all 0.3s ease;
      z-index: 1;
      overflow: hidden;
      min-width: 160px;
      text-align: center;
    }

    .btn::before {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 26, 191, 0.35) 0%, transparent 80%);
      animation: pulse 3s ease-in-out infinite;
      z-index: 0;
    }

    .btn span {
      position: relative;
      z-index: 2;
    }

    .btn:hover {
      transform: scale(1.05);
      box-shadow: 0 0 45px rgba(255, 26, 191, 0.9);
    }

    p {
      color: #bbb;
      font-size: 13px;
      opacity: 0.85;
      margin: 0;
      line-height: 1.5;
      max-width: 340px;
    }

    @keyframes pulse {
      0% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
      50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.2); }
      100% { opacity: 0.4; transform: translate(-50%, -50%) scale(1); }
    }

    @keyframes glowBackground {
      0% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
      100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1.2); }
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
